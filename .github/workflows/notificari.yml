name: Notificari super oferte (ntfy)
on:
  push:
    branches: [main]
    paths: ["web/data.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: python3 .github/scripts/notifica.py
        env:
          NTFY_TOPIC: oferte-romania-bm2011
